<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lion Trans</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: dark control-room. Graphite bands, one red hairline system, the globe and the ship as instruments. */
:root{
  --ink:#0A0B0D; --panel:#101216; --panel-2:#15181D; --line:#242931;
  --fg:#F2F3F5; --dim:#8E949D; --faint:#5A6069;
  --red:#E11B22; --cyan:#4FD6C9;
  --display:'Archivo','Noto Sans Georgian','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Noto Sans Georgian','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Georgian',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(56px,8vw,112px)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
:lang(ka) h1,:lang(ka) h2,:lang(ka) h3{letter-spacing:0}
.section-h{font-size:clamp(26px,4vw,42px)}
.band{background:var(--panel);border-block:1px solid var(--line)}

.rule{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.rule span{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.rule i{height:1px;background:var(--red);flex:1;min-width:28px}
.rule b{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}

header{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(10,11,13,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
body{padding-top:68px}
section[id],#top,#contact{scroll-margin-top:84px}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;flex:none;text-decoration:none}
.logo img{height:34px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto;flex:none}
.lang button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 14px;background:none;border:0;color:var(--dim);cursor:pointer;transition:background .18s,color .18s}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff}

/* burger + full-screen menu */
.burger{width:46px;height:46px;flex:none;display:grid;place-items:center;gap:0;background:none;border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .2s}
.burger:hover{border-color:var(--red)}
.burger:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.burger span{display:block;width:18px;height:1.6px;background:var(--fg);grid-area:1/1;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .2s}
.burger span:nth-child(1){transform:translateY(-5.5px)}
.burger span:nth-child(3){transform:translateY(5.5px)}
.burger[aria-expanded="true"] span:nth-child(1){transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:rotate(-45deg)}

.menu{position:fixed;inset:0;z-index:39;background:rgba(10,11,13,.97);backdrop-filter:blur(18px);
  display:grid;align-content:center;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
.menu.open{opacity:1;visibility:visible}
.menu-inner{max-width:1180px;margin:0 auto;width:100%;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.menu a{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:22px;text-decoration:none;
  border-top:1px solid var(--line);padding:clamp(14px,2.4vw,26px) 0;
  opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1),color .2s}
.menu.open a{opacity:1;transform:none}
.menu a:last-of-type{border-bottom:1px solid var(--line)}
.menu a em{font-family:var(--mono);font-style:normal;font-size:11px;letter-spacing:.18em;color:var(--faint)}
.menu a b{font-family:var(--display);font-weight:600;font-size:clamp(28px,5.4vw,62px);letter-spacing:-.035em;line-height:1}
.menu a:hover b{color:var(--red)}
.menu a:hover em{color:var(--red)}
.menu-foot{display:flex;flex-wrap:wrap;gap:10px 30px;margin-top:clamp(22px,3vw,40px);
  font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.05em}
body.locked{overflow:hidden}

.hero{padding-block:clamp(36px,5vw,64px) clamp(28px,4vw,52px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(38px,6vw,76px);font-weight:700;letter-spacing:-.035em}
:lang(ka) .hero h1{font-size:clamp(32px,5vw,62px);letter-spacing:-.01em}
.hero h1 span{color:var(--red)}
.lede{color:var(--dim);font-size:17px;max-width:48ch;margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:15px 24px;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:transparent;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
.btn::after{content:"→";font-size:14px;line-height:1;transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
.btn:hover::after{transform:translateX(4px)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 26px rgba(225,27,34,.26)}
.btn.solid:hover{background:#C4161C;box-shadow:0 16px 34px rgba(225,27,34,.34)}
.btn.ghost:hover{border-color:var(--fg);background:rgba(255,255,255,.045)}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}}

/* globe */
.globe{position:relative;width:100%;max-width:510px;margin-inline:auto;aspect-ratio:1;touch-action:pan-y}
.globe canvas{width:100%;height:100%;display:block;cursor:grab}
.globe canvas:active{cursor:grabbing}
.pin{position:absolute;top:0;left:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);padding:4px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .25s;will-change:transform}
.pin.hub{background:var(--red);border-color:var(--red)}
.globe-foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.globe-foot b{color:var(--red);font-weight:500}
.globe-foot u{color:var(--cyan);text-decoration:none}

/* live-tracking console under the globe */
.console{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));margin-top:clamp(26px,4vw,44px)}
.cbar{display:grid;grid-template-columns:minmax(230px,1.05fr) auto minmax(320px,1.5fr);align-items:stretch}
.lane{padding:16px 20px;border-right:1px solid var(--line);min-width:0}
.cpct{padding:16px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:7px}
@media(max-width:900px){.cbar{grid-template-columns:1fr}.lane,.cpct{border-right:0;border-bottom:1px solid var(--line)}}
.lane h5{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0 0 9px;font-weight:400}
.lane h5 em{font-style:normal;border:1px solid rgba(79,214,201,.4);border-radius:999px;padding:2px 7px;font-size:8.5px;letter-spacing:.1em}
.lane .route{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.lane .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:5px}
.lane-pct{display:flex;align-items:baseline;gap:12px;font-family:var(--display);font-size:clamp(28px,4vw,36px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.lane-pct i{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--dim);letter-spacing:.05em;font-weight:400}
.bar{height:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);width:0;transition:width .25s linear}
.hudstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
@media(max-width:900px){.hudstrip{grid-template-columns:repeat(2,1fr)}}
.hudcell{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.hudcell b{font-family:var(--display);font-size:18px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.hudcell span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block;margin-top:4px}

/* capacity infographic — two labelled groups of three, then the headline claim */
.infog{display:grid;gap:26px;margin-top:32px}
.mgroup{display:grid;gap:13px}
.mgroup h5{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0;display:flex;align-items:center;gap:14px;font-weight:400}
.mgroup h5::after{content:"";height:1px;flex:1;background:var(--line)}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.metric{border:1px solid var(--line);background:var(--panel);padding:24px 22px;display:grid;gap:16px;transition:transform .2s,border-color .2s,background .2s}
.metric:hover{transform:translateY(-4px);border-color:rgba(225,27,34,.5);background:var(--panel-2)}
.claim{display:grid;grid-template-columns:auto auto 1fr;gap:22px;align-items:center;padding:24px;
  border:1px solid rgba(225,27,34,.34);background:linear-gradient(100deg,rgba(225,27,34,.15),rgba(16,18,22,.55) 60%)}
.claim strong{font-family:var(--display);font-size:clamp(40px,6.4vw,66px);font-weight:700;letter-spacing:-.05em;line-height:.88}
.claim p{color:var(--dim);font-size:14.5px;max-width:54ch}
@media(max-width:700px){.mrow{grid-template-columns:1fr}.claim{grid-template-columns:1fr;gap:14px}}
.ico{position:relative;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(150deg,rgba(225,27,34,.3),rgba(225,27,34,.08) 42%,rgba(12,14,18,.9));
  border:1px solid rgba(225,27,34,.45);
  box-shadow:0 0 26px rgba(225,27,34,.16),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -12px 22px rgba(0,0,0,.45);
  transition:box-shadow .25s,border-color .25s,transform .25s}
.ico::after{content:"";position:absolute;inset:1px;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 55%);pointer-events:none}
.metric:hover .ico{border-color:rgba(225,27,34,.85);box-shadow:0 0 38px rgba(225,27,34,.34),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -12px 22px rgba(0,0,0,.4);transform:translateY(-1px)}
.ico svg{width:28px;height:28px;position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
.metric strong{font-family:var(--display);font-size:clamp(34px,4.6vw,52px);font-weight:700;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.metric span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-top:9px}
.meter{height:2px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),rgba(225,27,34,.25))}
@media(max-width:900px){.metrics{grid-template-columns:repeat(4,1fr)}.metric,.metric:nth-child(1),.metric:nth-child(2){grid-column:span 2}}
@media(max-width:520px){.metrics{grid-template-columns:1fr}.metric,.metric:nth-child(1),.metric:nth-child(2){grid-column:span 1}}

/* purpose / guarantee over the ship */
.creed{position:relative;overflow:hidden;background:
   radial-gradient(70% 55% at 50% 50%,rgba(255,255,255,.06),transparent 72%),
   repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 72px),
   repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 72px),
   var(--ink);
  border-block:1px solid var(--line)}
.creed .wrap{position:relative;z-index:1;display:grid;gap:clamp(70px,13vw,190px)}
.creed-block{max-width:430px;background:radial-gradient(120% 140% at 50% 50%,rgba(10,11,13,.92),rgba(10,11,13,0) 72%)}
.creed-block.right{justify-self:end;text-align:right}
.creed-block.right .rule{flex-direction:row-reverse}
.creed h2{font-size:clamp(24px,3.4vw,36px);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:14px}
:lang(ka) .creed h2{text-transform:none;letter-spacing:0}
.creed p{color:var(--dim);font-size:15.5px;white-space:pre-line}
.ship-lane{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ship-drift{position:absolute;left:50%;top:50%;height:min(46%,340px);aspect-ratio:56/300;animation:drift 40s linear infinite}
.ship-rot{width:100%;height:100%;transform:rotate(45deg);animation:sway 13s ease-in-out infinite}
.ship{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
@keyframes drift{
  0%{transform:translate(calc(-50% - min(34vw,400px)),calc(-50% + min(26vw,280px)));opacity:0}
  14%,86%{opacity:1}
  100%{transform:translate(calc(-50% + min(34vw,400px)),calc(-50% - min(26vw,280px)));opacity:0}
}
@keyframes sway{0%,100%{transform:rotate(43.6deg)}50%{transform:rotate(46.4deg)}}
.ripple{animation:ripple 7s ease-out infinite}
.ripple:nth-of-type(2){animation-delay:2.3s}
.ripple:nth-of-type(3){animation-delay:4.6s}
@keyframes ripple{0%{opacity:.5;transform:translateY(0) scaleX(.7)}100%{opacity:0;transform:translateY(46px) scaleX(1.5)}}
.swell{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 25%,rgba(255,255,255,.07) 75%,transparent)}
.ship-scale{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);white-space:nowrap;z-index:1}
@media(max-width:900px){.ship-drift{opacity:.34;height:34%}.ship-scale{display:none}.creed-block.right{text-align:left;justify-self:start}.creed-block.right .rule{flex-direction:row}}

/* services as tabs */
.tabs{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:36px}
.tab{flex:1 1 220px;min-width:0;background:var(--panel);border:0;color:var(--dim);text-align:left;padding:18px 20px;cursor:pointer;font-family:var(--body);transition:background .2s,color .2s}
.tab em{display:block;font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.18em;color:var(--faint);margin-bottom:7px;transition:color .2s}
.tab b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.tab:hover{background:var(--panel-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 2px 0 var(--red)}
.tab[aria-selected="true"] em{color:var(--red)}
.tab:focus-visible{outline:2px solid var(--cyan);outline-offset:-3px}
.panel{position:relative;border:1px solid var(--line);border-top:0;background:var(--panel-2);padding:clamp(26px,4vw,44px);overflow:hidden}
.panel .ghost-num{position:absolute;right:-8px;top:-34px;font-family:var(--display);font-size:clamp(140px,20vw,230px);font-weight:700;color:rgba(255,255,255,.028);line-height:1;pointer-events:none;user-select:none}
.panel-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:26px 34px}
.svc{display:grid;gap:8px;padding-left:18px;border-left:1px solid var(--line);animation:rise .45s ease both}
.svc:hover{border-left-color:var(--red)}
.svc h4{font-size:16px;font-weight:600}
.svc p{color:var(--dim);font-size:14px;line-height:1.55}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* timeline, alternating */
.tl{position:relative;margin-top:48px;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,transparent,var(--line) 8%,var(--line) 92%,transparent)}
.tl li{position:relative;padding:0 0 30px 36px}
.tl li::before{content:"";position:absolute;left:3px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(225,27,34,.14)}
.tl em{font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.16em;color:var(--faint)}
.tl h4{font-size:17px;font-weight:600;margin:6px 0 5px}
.tl p{color:var(--dim);font-size:14px;max-width:62ch}
@media(min-width:900px){
  .tl::before{left:50%}
  .tl li{width:50%;padding:0 42px 42px 0;text-align:right}
  .tl li::before{left:auto;right:-4.5px}
  .tl li:nth-child(even){margin-left:50%;padding:0 0 42px 42px;text-align:left}
  .tl li:nth-child(even)::before{left:-4.5px;right:auto}
  .tl li p{max-width:none}
}

/* animated buying instruction */
.journey{margin-top:40px}
.road{position:relative;height:148px;margin-bottom:10px}
.road-line{position:absolute;left:0;right:0;bottom:30px;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px)}
.road-line::after{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:linear-gradient(90deg,transparent,rgba(225,27,34,.16),transparent)}
.jnode{position:absolute;bottom:22px;width:17px;height:17px;border-radius:50%;background:var(--ink);border:1px solid var(--line);transform:translateX(-50%);display:grid;place-items:center;transition:border-color .3s,box-shadow .3s}
.jnode i{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background .3s,transform .3s}
.jnode.on{border-color:var(--red);box-shadow:0 0 0 5px rgba(225,27,34,.14)}
.jnode.on i{background:var(--red);transform:scale(1.2)}
.carbox{position:absolute;bottom:26px;left:0;width:clamp(196px,27vw,320px);will-change:transform}
.carbox img{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 22px rgba(0,0,0,.6))}
.carplate{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);text-align:center;margin-top:6px;white-space:nowrap}
.jsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.jstep{background:var(--panel);padding:22px 20px;transition:background .3s,transform .3s;position:relative}
.jstep::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red);transform:scaleY(0);transform-origin:top;transition:transform .35s}
.jstep.on{background:var(--panel-2)}
.jstep.on::before{transform:scaleY(1)}
.jstep em{font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.jstep h4{font-size:17px;margin:10px 0 7px}
.jstep p{color:var(--dim);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:14px;margin-top:40px}
.card{border:1px solid var(--line);background:var(--panel);padding:22px 20px;transition:transform .2s,border-color .2s,background .2s}
.card:hover{transform:translateY(-4px);border-color:var(--red);background:var(--panel-2)}
.card em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.card h4{font-size:17px;margin:10px 0 7px}
.card p{color:var(--dim);font-size:13.5px}

/* network: world map + an operations manifest */
.map{position:relative;width:100%;aspect-ratio:2.15/1;margin-top:32px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),#0C0E12);overflow:hidden}
.map canvas{width:100%;height:100%;display:block}
.map .legend{position:absolute;left:14px;bottom:12px;display:flex;gap:16px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint)}
.map .legend b{color:var(--red);font-weight:500}
.board{border:1px solid var(--line);background:var(--panel);margin-top:14px}
.board-head,.row{display:grid;grid-template-columns:minmax(118px,.85fr) minmax(110px,.9fr) minmax(190px,2fr) minmax(136px,1fr);gap:20px;padding:13px 18px;align-items:center}
.board-head{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);background:var(--panel-2);border-bottom:1px solid var(--line)}
.board-head .tel,.row .tel{text-align:right}
.row{border-top:1px solid var(--line);transition:background .18s,box-shadow .18s}
.row:first-of-type{border-top:0}
.row:hover{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--red)}
.row .cc{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:9px;min-width:0}
.row .cc i{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.row.hub .cc i{background:var(--red);box-shadow:0 0 0 3px rgba(225,27,34,.16)}
.row.hub .cc{color:var(--fg)}
.row .city{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.row .city s{text-decoration:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--cyan);border-radius:999px;padding:2px 7px}
.row .addr{color:var(--faint);font-size:13px}
.row .tel{font-family:var(--mono);font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.row.start{border-top-color:rgba(225,27,34,.32)}
@media(max-width:820px){
  .board-head{display:none}
  .row{grid-template-columns:1fr;gap:5px;padding:16px 18px}
  .row .tel{text-align:left}
}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px}
.person{background:var(--panel);padding:24px}
.person b{font-family:var(--display);font-size:17px;font-weight:600;display:block}
.person span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);display:block;margin-top:6px}
.person p{color:var(--dim);font-size:13.5px;margin-top:12px}

footer{border-top:1px solid var(--line);background:var(--panel);padding-block:48px 36px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.fgrid h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 14px;font-weight:400}
.fgrid a,.fgrid p{display:block;color:var(--dim);font-size:14px;text-decoration:none;padding:3px 0}
.fgrid a:hover{color:var(--red)}
.copy{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}
.sel{user-select:all}
/* country search above the manifest */
.search{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 16px;margin-top:14px}
.search svg{width:16px;height:16px;stroke:var(--faint);stroke-width:2;fill:none;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--mono);font-size:13px;padding:14px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.search:focus-within{border-color:rgba(225,27,34,.6)}
.search b{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;font-weight:400;white-space:nowrap}
.map canvas{cursor:crosshair}
.row.flash{background:rgba(225,27,34,.14)}

/* live lots from the auction */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:38px}
.lot{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,border-color .2s}
.lot:hover{transform:translateY(-4px);border-color:rgba(225,27,34,.5)}
.lot .ph{position:relative;aspect-ratio:4/3;background:#0C0E12;overflow:hidden}
.lot .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.lot:hover .ph img{transform:scale(1.04)}
.lot .no{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;background:rgba(10,11,13,.82);border:1px solid var(--line);padding:4px 9px}
.lot .cond{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--red);padding:4px 9px}
.lot .body{padding:16px 16px 18px;display:grid;gap:12px}
.lot h4{font-size:16px;font-weight:600;letter-spacing:-.01em}
.lot .price{font-family:var(--display);font-size:21px;font-weight:700;color:var(--red);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lot .where{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:-6px}
.lot .specs{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;border-top:1px solid var(--line);padding-top:12px}
.lot .specs span{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;gap:7px;align-items:baseline;min-width:0}
.lot .specs span i{color:var(--faint);font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.lot .specs span u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lot .go{margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--fg);border:1px solid var(--line);padding:11px 14px;transition:.18s}
.lot .go:hover{border-color:var(--red);background:rgba(225,27,34,.1)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const D = {"en":{"main_banner_title":"YOUR RELIABLE <span>PARTNER</span>","meta_main_desc":"Liontrans is a logistics company offering a wide range of high-quality services to meet your shipping needs in Georgia.","about_us_title_header":"About Lion Auto Auction","about_us_title_desc":"Lion Auto Auction is an online vehicle trading platform created by the international holding Lion Group which serves individuals and legal entities in Europe and Asia.","about_us_1_title":"Who we are","about_us_1_desc_1":"Lion Auto Auction is an online platform for trading vehicles, where people who want to buy and sell a car at a reasonable price meet each other.","about_us_1_desc_2":"We have four categories of cars for those who want to buy one:\n\r On-Site - Vehicles inspected by us, parked in Tserovani parking lot.\n\r Off-Site - Vehicles whose photos are posted on our website but are not physically at our parking lot.\n\r In Transit - cars coming from America, which you can buy at the time of transportation.\n\r On Timer - specific vehicles in our database that meet your wishes and needs","about_us_2_title":"Our guarantee","about_us_2_desc_1":"Time and energy are the prime human resources that need to be valued and warned.\n\r We promise that purchasing vehicles with our help will be an easy, comfortable, and enjoyable process.","about_us_3_title":"Our purpose","about_us_3_desc_1":"We want to introduce the community to the culture of buying a car with the help of an online auction because we believe that the auction is the place where old vehicles should gain new life and function.","about_us_advantages_header":"Our advantages","about_us_advantages_1_desc":"Vehicles purchased through the Lion Auto Auction website arrive at their destination much earlier than when purchased at US auto auctions.","about_us_advantages_2_desc":"We are an international company, that's why the cars that are posted on our website are watched in Ukraine, Azerbaijan, Armenia, Kazakhstan, Kyrgyzstan, Belarus, and Georgia.","about_us_advantages_3_desc":"From the moment you want to buy a car to the time you get in that car, you go through all the procedures in one place.","about_us_advantages_4_desc":"Lion Auto Auction, as a subsidiary company of the international holding Lion Trans, has the support of dozens of trusted and experienced partners, allowing us to take full responsibility at any step of the service.","services":"Services","services_lionauction_title":"Lion Auto Auction:","services_lionauction_item_1_title":"Importing new and used cars","services_lionauction_item_1_desc":"Importing new and used cars from the leading auctions in America and delivering them worldwide. Taking charge of finding, selecting, and evaluating vehicles, making sure that the customers get the best deal by paying 35% less than the market price, all while ensuring that the car comes with warranty conditions.","services_lionauction_item_2_title":"The showroom","services_lionauction_item_2_desc":"Offers brand-new, fully electric cars with zero mileage.","services_lionauction_item_3_title":"Lion Yard Tserovani ","services_lionauction_item_3_desc":"A auto park where customers can choose and purchase cars or put their vehicles up for sale. All cars in the parking lot undergo a thorough inspection by the relevant service to ensure quality. The area is secured with a 24-hour video control security service to ensure the safety of the vehicles.","services_lionauction_item_4_title":"Cars in Transit ","services_lionauction_item_4_desc":"Lion Auto Auction provides the option to purchase off-the-road cars from America, significantly reducing customers' waiting period and allowing them to become the owner of their desired car in the shortest possible time.","services_liontrans_title":"Lion Trans","services_liontrans_item_1_title":"Warehousing Services/Warehouses in America","services_liontrans_item_1_desc_1":"With our experience and strategically located warehouses, any cargo can be securely stored. A /* ---------- deck cargo: cars drawn to scale on the ship ---------- */
(function cargo() {
  const g = document.getElementById('ship-cars');
  const rnd = (s => () => (s = s * 1664525 + 1013904223 >>> 0) / 4294967296)(20080717);
  const palette = ['#8A919B','#6E7681','#AEB5BE','#525963','#767E89'];
  // 1 unit = 0.676 m, so a 4.5 × 1.8 m car is 6.68 × 2.67 units: 11 lanes × 23 rows
  let out = '';
  for (let col = 0; col < 11; col++) {
    for (let row = 0; row < 23; row++) {
      if (rnd() < 0.06) continue;
      const x = 9.2 + col * 3.45, y = 62 + row * 7.54;
      const fill = rnd() < 0.07 ? '#E11B22' : palette[(rnd() * palette.length) | 0];
      out += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="2.67" height="6.68" rx=".6" fill="${fill}" opacity="${(0.62 + rnd() * 0.3).toFixed(2)}"/>`;
    }
  }
  g.innerHTML = out;
})();

/* ---------- animated buying instruction ---------- */
const road = document.getElementById('road');
const carbox = document.getElementById('carbox');
let stops = [], roadW = 0, carW = 0;
function layoutRoad() {
  roadW = road.clientWidth; carW = carbox.clientWidth;
  const span = Math.max(roadW - carW, 1);
  stops = [0, span / 2, span];
  road.querySelectorAll('.jnode').forEach(n => n.remove());
  stops.forEach((s, i) => {
    const n = document.createElement('div');
    n.className = 'jnode'; n.dataset.i = i;
    n.style.left = (s + carW / 2) + 'px';
    n.innerHTML = '<i></i>';
    road.appendChild(n);
  });
}
new ResizeObserver(layoutRoad).observe(road);

const SEG = 1400, DWELL = 1700;
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastStep = -2;

function setActive(i) {
  if (i === lastStep) return;
  lastStep = i;
  document.querySelectorAll('.jstep').forEach(s => s.classList.toggle('on', +s.dataset.i === i));
  road.querySelectorAll('.jnode').forEach(n => n.classList.toggle('on', +n.dataset.i === i));
}

function journey(time) {
  if (!stops.length) return;
  const cycle = 4 * SEG + 3 * DWELL;
  const path = [-carW - 20, stops[0], stops[1], stops[2], roadW + 40];
  let x, step = -1;
  if (reduced) { x = stops[0]; step = 0; }
  else {
    let tt = time % cycle;
    for (let i = 0; i < 4; i++) {
      if (tt < SEG) { x = path[i] + (path[i + 1] - path[i]) * ease(tt / SEG); step = tt > SEG * .75 && i < 3 ? i : -1; break; }
      tt -= SEG;
      if (i < 3) {
        if (tt < DWELL) { x = path[i + 1]; step = i; break; }
        tt -= DWELL;
      }
    }
  }
  carbox.style.transform = `translateX(${x}px)`;
  setActive(step);
}

/* ---------- globe ---------- */
const EN_OFF = D.en._offices;
const HUBS = ['Poti', 'Tbilisi'];
const PINNED = ['New Jersey', 'California', 'Poti', 'Rotterdam', 'Dubai', 'Guangzhou', 'Bishkek'];
const points = EN_OFF.flatMap((c, ci) => c.offieces.map((o, oi) => ({
  ci, oi, key: o.name, coord: [o.lng, o.lat], hub: HUBS.includes(o.name)
})));
const poti = points.find(p => p.key === 'Poti').coord;
const ROUTES = ['New Jersey', 'California', 'Bremerhaven', 'Guangzhou', 'Dubai']
  .map(n => points.find(p => p.key === n)).filter(Boolean)
  .map(p => ({ from: p.coord, to: poti, interp: d3.geoInterpolate(p.coord, poti) }));

const TRACK_ENDS = [points.find(p => p.key === 'New Jersey'), points.find(p => p.key === 'Poti')];
const VOYAGE_DAYS = 32;
let lastPct = -1;
function renderCardRoute() {
  const el = document.getElementById('tc-route');
  if (!el) return;
  el.textContent = TRACK_ENDS.map(p => D[lang]._offices[p.ci].offieces[p.oi].name).join(' → ');
  lastPct = -1;
}
function updateCard(f) {
  const pct = Math.round(f * 100);
  if (pct === lastPct) return;
  lastPct = pct;
  const p = document.getElementById('tc-pct');
  if (!p) return;
  p.textContent = pct;
  document.getElementById('tc-bar').style.width = pct + '%';
  document.getElementById('tc-eta').textContent =
    u('eta') + ' · ' + Math.max(1, Math.round((1 - f) * VOYAGE_DAYS)) + ' ' + u('days');
}

const host = document.getElementById('globe');
const canvas = document.createElement('canvas');
host.appendChild(canvas);
const ctx = canvas.getContext('2d');
const pins = new Map();
points.filter(p => PINNED.includes(p.key)).forEach(p => {
  const el = document.createElement('div');
  el.className = 'pin' + (p.hub ? ' hub' : '');
  host.appendChild(el);
  pins.set(p, el);
});
function renderPins() { pins.forEach((el, p) => { el.textContent = D[lang]._offices[p.ci].offieces[p.oi].name; }); }

/* ---------- flat network map ---------- */
const mapHost = document.getElementById('map');
const mapCanvas = mapHost.querySelector('canvas');
const mctx = mapCanvas.getContext('2d');
const mproj = d3.geoNaturalEarth1();
const mpath = d3.geoPath(mproj, mctx);
let hoverPin = -1;

function drawMap() {
  const w = mapHost.clientWidth, h = mapHost.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mapCanvas.width = w * dpr; mapCanvas.height = h * dpr;
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mproj.fitExtent([[14, 10], [w - 14, h - 10]], { type: 'Sphere' });
  mctx.clearRect(0, 0, w, h);

  mctx.beginPath(); mpath({ type: 'Sphere' });
  mctx.fillStyle = '#0E1116'; mctx.fill();
  mctx.beginPath(); mpath(d3.geoGraticule10());
  mctx.strokeStyle = 'rgba(255,255,255,.04)'; mctx.lineWidth = 1; mctx.stroke();
  mctx.beginPath(); mpath(LAND);
  mctx.fillStyle = '#242A32'; mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,.1)'; mctx.lineWidth = .6; mctx.stroke();

  const potiXY = mproj(poti);
  points.forEach((p, i) => {
    const xy = mproj(p.coord);
    if (!xy) return;
    if (!p.hub) {
      mctx.beginPath(); mctx.moveTo(xy[0], xy[1]); mctx.lineTo(potiXY[0], potiXY[1]);
      mctx.strokeStyle = i === hoverPin ? 'rgba(225,27,34,.5)' : 'rgba(255,255,255,.07)';
      mctx.lineWidth = i === hoverPin ? 1.2 : .7; mctx.stroke();
    }
  });
  points.forEach((p, i) => {
    const xy = mproj(p.coord);
    if (!xy) return;
    const on = i === hoverPin;
    const dim = visiblePins && !visiblePins.has(i);
    mctx.globalAlpha = dim ? .22 : 1;
    if (p.hub || on) {
      mctx.beginPath(); mctx.arc(xy[0], xy[1], on ? 9 : 7, 0, 7);
      mctx.fillStyle = 'rgba(225,27,34,.16)'; mctx.fill();
    }
    mctx.beginPath(); mctx.arc(xy[0], xy[1], p.hub ? 4 : (on ? 4 : 2.6), 0, 7);
    mctx.fillStyle = p.hub || on ? '#E11B22' : '#C9CED6'; mctx.fill();
    if (on) {
      const label = D[lang]._offices[p.ci].offieces[p.oi].name;
      mctx.font = '500 12px "IBM Plex Mono", monospace';
      const tw = mctx.measureText(label).width;
      const lx = Math.min(Math.max(xy[0] - tw / 2 - 7, 4), w - tw - 18);
      mctx.fillStyle = 'rgba(10,11,13,.9)';
      mctx.fillRect(lx, xy[1] - 28, tw + 14, 20);
      mctx.strokeStyle = 'rgba(225,27,34,.6)'; mctx.lineWidth = 1;
      mctx.strokeRect(lx, xy[1] - 28, tw + 14, 20);
      mctx.fillStyle = '#F2F3F5';
      mctx.fillText(label, lx + 7, xy[1] - 14);
    }
    mctx.globalAlpha = 1;
  });
}

function pinAt(ev) {
  const r = mapCanvas.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = -1, bd = 15 * 15;
  points.forEach((p, i) => {
    if (visiblePins && !visiblePins.has(i)) return;
    const xy = mproj(p.coord); if (!xy) return;
    const d = (xy[0] - x) ** 2 + (xy[1] - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
mapCanvas.addEventListener('pointermove', e => {
  const i = pinAt(e);
  mapCanvas.style.cursor = i >= 0 ? 'pointer' : 'crosshair';
  if (i !== hoverPin) { hoverPin = i; drawMap(); }
});
mapCanvas.addEventListener('pointerleave', () => { if (hoverPin !== -1) { hoverPin = -1; drawMap(); } });
mapCanvas.addEventListener('click', e => {
  const i = pinAt(e);
  if (i < 0) return;
  const row = document.querySelector(`.row[data-p="${i}"]`);
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1600);
});
new ResizeObserver(drawMap).observe(mapHost);
document.getElementById('board').addEventListener('pointerover', e => {
  const r = e.target.closest('.row');
  const i = r ? +r.dataset.p : -1;
  if (i !== hoverPin) { hoverPin = i; drawMap(); }
});
document.getElementById('board').addEventListener('pointerleave', () => {
  if (hoverPin !== -1) { hoverPin = -1; drawMap(); }
});

const projection = d3.geoOrthographic().precision(0.4);
const path = d3.geoPath(projection, ctx);
const graticule = d3.geoGraticule10();
let size = 0, rotation = [-20, -22], dragging = null;

function resize() {
  size = host.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr; canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  projection.translate([size / 2, size / 2]).scale(size / 2 - 14);
}
new ResizeObserver(resize).observe(host);
resize();

canvas.addEventListener('pointerdown', e => {
  dragging = { x: e.clientX, y: e.clientY, r: rotation.slice() };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = 160 / projection.scale();
  rotation = [dragging.r[0] + (e.clientX - dragging.x) * k,
              Math.max(-80, Math.min(80, dragging.r[1] - (e.clientY - dragging.y) * k))];
});
addEventListener('pointerup', () => { dragging = null; });

function draw(time) {
  if (!dragging && !reduced) rotation[0] += 0.055;
  projection.rotate(rotation);
  ctx.clearRect(0, 0, size, size);

  ctx.beginPath(); path({ type: 'Sphere' });
  const g = ctx.createRadialGradient(size * .38, size * .32, size * .05, size * .5, size * .5, size * .55);
  g.addColorStop(0, '#1B2027'); g.addColorStop(1, '#0D0F13');
  ctx.fillStyle = g; ctx.fill();

  ctx.beginPath(); path(graticule);
  ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath(); path(LAND);
  ctx.fillStyle = '#2E343D'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = .6; ctx.stroke();

  ROUTES.forEach((r, i) => {
    ctx.beginPath(); path({ type: 'LineString', coordinates: [r.from, r.to] });
    ctx.strokeStyle = i === 0 ? 'rgba(79,214,201,.75)' : 'rgba(225,27,34,.5)';
    ctx.lineWidth = i === 0 ? 1.6 : 1.2;
    ctx.setLineDash(i === 0 ? [] : [3, 4]);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  const centre = [-rotation[0], -rotation[1]];
  ROUTES.forEach((r, i) => {
    const f = (time / 5200 + i / ROUTES.length) % 1;
    const c = r.interp(f);
    if (i === 0) updateCard(f);
    if (d3.geoDistance(c, centre) > Math.PI / 2) return;
    const [x, y] = projection(c);
    if (i === 0) { ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fillStyle = 'rgba(79,214,201,.22)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, i === 0 ? 3.4 : 2.6, 0, 7);
    ctx.fillStyle = i === 0 ? '#4FD6C9' : '#E11B22'; ctx.fill();
  });

  const placed = [];
  points.forEach(p => {
    const visible = d3.geoDistance(p.coord, centre) < Math.PI / 2;
    const [x, y] = projection(p.coord);
    if (visible) {
      ctx.beginPath(); ctx.arc(x, y, p.hub ? 4 : 2.4, 0, 7);
      ctx.fillStyle = p.hub ? '#E11B22' : '#C9CED6'; ctx.fill();
      if (p.hub) {
        ctx.beginPath(); ctx.arc(x, y, 9 + Math.sin(time / 420) * 2.5, 0, 7);
        ctx.strokeStyle = 'rgba(225,27,34,.45)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    const el = pins.get(p);
    if (!el) return;
    el.style.opacity = visible ? 1 : 0;
    if (!visible) return;
    const w = el.offsetWidth || 70;
    const left = x > size * .58;
    let lx = left ? x - w - 12 : x + 12, ly = y - 10;
    // keep labels from stacking on top of each other
    for (const q of placed) {
      if (Math.abs(ly - q.y) < 20 && Math.abs(lx - q.x) < Math.max(w, q.w)) ly = q.y + 22;
    }
    placed.push({ x: lx, y: ly, w });
    el.style.transform = `translate(${lx}px, ${ly}px)`;
  });

  journey(time);
  requestAnimationFrame(draw);
}

render();
layoutRoad();
requestAnimationFrame(draw);
</script>

</body>
</html>
